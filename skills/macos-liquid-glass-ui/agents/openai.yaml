interface:
  display_name: "macOS Liquid Glass UI"
  short_description: "Web/桌面壳 Liquid Glass UI：材质与 clear 判定、窗口导航、完整组件、Electron/Tauri 窗口原生材质、中文/RTL 排版、Inspira UI 增强、响应式、可访问性、性能预算与验收"
  default_prompt: "使用 $macos-liquid-glass-ui，为当前 Web、桌面 Web App 或 Electron/Tauri 产品设计、实现或审查 Liquid Glass 风格界面。先判断页面范式和内容层/功能层，明确滚动归属、Toolbar/Sidebar/Search、完整组件状态、响应式、仅文字放大与可访问性；桌面产品先判断窗口原生材质能否承载，不要用页面 backdrop-filter 假装透明窗口；Vue/Nuxt 项目若明确要求 Inspira UI，则把它作为可选视觉增强层并遵守 motion/performance/accessibility 约束；原生 SwiftUI/AppKit 请求改用 native skill，App Icon 请求改用 icon skill。"
