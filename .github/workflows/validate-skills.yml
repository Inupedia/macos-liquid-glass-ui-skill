name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check scripts compile
        run: python3 -m py_compile scripts/*.py

      - name: Validate skill structure, references and eval fixtures
        run: python3 scripts/validate_skills.py --strict

      - name: Smoke-test the eval runner
        run: |
          python3 scripts/run_evals.py --list
          python3 scripts/run_evals.py --routing --json > /dev/null
